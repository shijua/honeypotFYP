name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Unit
        run: pytest -m unit

      - name: Component
        run: pytest -m component

      - name: Contract
        run: pytest -m contract

      - name: E2E Smoke
        run: pytest -m e2e_smoke

      - name: Adapter
        run: pytest -m adapter
