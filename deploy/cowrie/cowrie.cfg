# Minimal Cowrie configuration for the dynamic honeynet MVP.
#
# Keep this file small: Cowrie also loads its built-in cowrie.cfg.dist, and this
# file should only override the settings we care about for local data capture.

[honeypot]
# Fake hostname shown inside the Cowrie shell.
hostname = fileserver-01

[ssh]
enabled = true

[telnet]
# SSH is enough for the first MVP data path. Telnet can be enabled later if the
# deployment network intentionally exposes it.
enabled = false

[output_jsonlog]
# The log forwarder reads var/log/cowrie/cowrie.json and POSTs each JSON record
# into services.cowrie.app.
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
