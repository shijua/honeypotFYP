<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Northbridge Login</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
  <link rel="stylesheet" href="/assets/app.css">
</head>
<body class="d-flex flex-column">
  <div class="page page-center">
    <div class="container container-tight py-4">
      <div class="text-center mb-4">
        <a class="navbar-brand navbar-brand-autodark justify-content-center" href="/">
          <span class="brand-mark">N</span>
          Northbridge
        </a>
      </div>
      <form class="card card-md" method="post" action="/api/v1/login">
        <div class="card-body">
          <h2 class="h2 text-center mb-4">Employee and customer login</h2>
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input class="form-control" name="email" type="email" autocomplete="username" placeholder="name@company.example">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input class="form-control" name="password" type="password" autocomplete="current-password" placeholder="Password">
          </div>
          <div class="form-footer">
            <button class="btn btn-primary w-100" type="submit">Sign in</button>
          </div>
          <div class="alert alert-warning mt-3 mb-0" role="alert">SSO maintenance window: Sunday 01:00-02:00 UTC.</div>
        </div>
      </form>
    </div>
  </div>
  <script src="/assets/app.js"></script>
</body>
</html>
