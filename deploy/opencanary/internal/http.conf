{
  "device.node_id": "opencanary-internal-http",
  "device.listen_addr": "0.0.0.0",
  "ip.ignorelist": [],
  "git.enabled": false,
  "ftp.enabled": false,
  "http.banner": "Apache/2.4.49",
  "http.enabled": true,
  "http.port": 80,
  "http.skin": "basicLogin",
  "https.enabled": false,
  "httpproxy.enabled": false,
  "mysql.enabled": false,
  "portscan.enabled": false,
  "redis.enabled": false,
  "ssh.enabled": false,
  "telnet.enabled": false,
  "tftp.enabled": false,
  "vnc.enabled": false,
  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {
        "plain": {
          "format": "%(message)s"
        }
      },
      "handlers": {
        "console": {
          "class": "logging.StreamHandler",
          "stream": "ext://sys.stdout"
        },
        "file": {
          "class": "logging.FileHandler",
          "filename": "/var/tmp/opencanary.log"
        }
      }
    }
  }
}
