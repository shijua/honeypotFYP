<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Plant PLC Status</title>
  <style>
    body { margin: 0; font-family: Arial, sans-serif; color: #16202a; background: #eef3f5; }
    header { background: #0f3a3d; color: #fff; padding: 22px 36px; }
    main { max-width: 940px; margin: 28px auto; padding: 0 20px; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; }
    .card { background: #fff; border: 1px solid #cbd8dd; padding: 16px; }
    .label { color: #5a6b73; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; }
    .value { font-size: 26px; font-weight: 700; margin-top: 7px; }
    .ok { color: #0e7a42; }
    .warn { color: #a86100; }
    code { background: #e5edf0; padding: 2px 5px; }
  </style>
</head>
<body>
  <header>
    <h1>PLC-02 Water Treatment Panel</h1>
    <p>Internal engineering status view. Remote write mode disabled.</p>
  </header>
  <main>
    <div class="grid">
      <div class="card"><div class="label">Unit ID</div><div class="value">2</div></div>
      <div class="card"><div class="label">Line</div><div class="value">Filter B</div></div>
      <div class="card"><div class="label">Mode</div><div class="value ok">Auto</div></div>
      <div class="card"><div class="label">Alarm</div><div class="value warn">Low</div></div>
    </div>
    <p>Engineering notes reference <a href="/config/plc-backup-2026-04.cfg"><code>plc-backup-2026-04.cfg</code></a>, <a href="/maps/modbus-unit-map.csv">legacy Modbus maps</a>, <a href="/captures/plant-span-summary.txt">plant span summaries</a>, and <a href="/captures/camera-index.csv">camera indexes</a> for unit IDs 1 and 2.</p>
  </main>
</body>
</html>
