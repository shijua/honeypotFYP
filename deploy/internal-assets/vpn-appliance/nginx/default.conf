server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }

    location ^~ /backup/ {
        auth_basic "Remote Access Gateway";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri =404;
    }

    location ^~ /download/ {
        auth_basic "Remote Access Gateway";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri =404;
    }

    location ^~ /logs/ {
        auth_basic "Remote Access Gateway";
        auth_basic_user_file /etc/nginx/.htpasswd;
        try_files $uri =404;
    }
}
