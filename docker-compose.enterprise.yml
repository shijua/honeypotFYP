version: "3.3"

services:
  public-portal:
    image: nginx:alpine
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${PUBLIC_PORTAL_PORT:-8080}:80"
    volumes:
      - ./deploy/public-portal/html:/usr/share/nginx/html:ro
      - ./deploy/public-portal/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/public-portal/logs:/var/log/nginx
    networks:
      - net_public
      - net_dmz
    restart: unless-stopped

  public-portal-forwarder:
    image: python:3.10-slim
    working_dir: /app
    command: >
      bash -lc "python scripts/forwarders/public_portal_access_log.py
      --log-file /public-portal-logs/access.log
      --observer-url http://entrypoint-observer:8010/v1/entrypoint/events
      --poll-seconds 0.5"
    environment:
      PYTHONPATH: /app
    volumes:
      - .:/app
      - ./deploy/public-portal/logs:/public-portal-logs
    networks:
      - net_control
    depends_on:
      - public-portal
      - entrypoint-observer
    restart: unless-stopped

  asset-gateway:
    image: python:3.10-slim
    working_dir: /app
    command: >
      bash -lc "python -m services.asset_gateway.app
      --ports ${ASSET_GATEWAY_PORTS:-18080,19418,13306,16379,18081,12121,12222,12323,2525,18082,18443,18085,1445,11433,12122,19999}
      --routes data/runtime/asset_gateway_routes.json"
    environment:
      PYTHONPATH: /app
      HONEYPOT_STATE_DIR: data/runtime
      HONEYPOT_INTERNAL_HTTP_EVENTS_FILE: data/runtime/internal_http_events.jsonl
      HONEYPOT_INTERNAL_PROTOCOL_EVENTS_FILE: data/runtime/internal_protocol_events.jsonl
      HONEYPOT_HIGH_INTERACTION_EVENTS_FILE: data/runtime/high_interaction_events.jsonl
      HONEYPOT_ASSET_GATEWAY_HTTP_PORTS: "${ASSET_GATEWAY_HTTP_PORTS:-18080,18081,18082,18443,18085}"
    volumes:
      - .:/app
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${INTERNAL_PORTAL_PORT:-18080}:18080"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${GIT_INTERNAL_PORT:-19418}:19418"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${OPS_DB_PORT:-13306}:13306"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${REDIS_CACHE_PORT:-16379}:16379"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${WEB_ADMIN_CONSOLE_PORT:-18081}:18081"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${FTP_ARCHIVE_PORT:-12121}:12121"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${SSH_CANARY_PORT:-12222}:12222"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${LEGACY_TELNET_PORT:-12323}:12323"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MAIL_RELAY_PORT:-2525}:2525"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${FINANCE_SHARE_PORT:-18082}:18082"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${VPN_APPLIANCE_PORT:-18443}:18443"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${MALWARE_SINK_PORT:-18085}:18085"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${DIONAEA_SMB_PORT:-1445}:1445"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${DIONAEA_MSSQL_PORT:-11433}:11433"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${DIONAEA_FTP_PORT:-12122}:12122"
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${HONEYTRAP_GENERIC_PORT:-19999}:19999"
    networks:
      - net_public
      - net_internal
    restart: unless-stopped

  internal-http-forwarder:
    image: python:3.10-slim
    working_dir: /app
    command: >
      bash -lc "python scripts/forwarders/internal_http_events.py
      --events-file data/runtime/internal_http_events.jsonl
      --observer-url http://entrypoint-observer:8010/v1/entrypoint/events
      --poll-seconds 0.5"
    environment:
      PYTHONPATH: /app
    volumes:
      - .:/app
    networks:
      - net_control
    depends_on:
      - entrypoint-observer
    restart: unless-stopped

  internal-protocol-forwarder:
    image: python:3.10-slim
    working_dir: /app
    command: >
      bash -lc "python scripts/forwarders/opencanary_json.py
      --log-file data/runtime/internal_protocol_events.jsonl
      --adapter-url http://opencanary-adapter:8012/v1/opencanary/events
      --poll-seconds 0.5"
    environment:
      PYTHONPATH: /app
    volumes:
      - .:/app
    networks:
      - net_control
    depends_on:
      - opencanary-adapter
    restart: unless-stopped

  high-interaction-adapter:
    image: python:3.10-slim
    working_dir: /app
    command: >
      bash -lc "pip install -q fastapi uvicorn pydantic &&
      python -m uvicorn services.high_interaction.app:app --host 0.0.0.0 --port 8014"
    environment:
      PYTHONPATH: /app
    volumes:
      - .:/app
    expose:
      - "8014"
    networks:
      - net_control
    restart: unless-stopped

  high-interaction-forwarder:
    image: python:3.10-slim
    working_dir: /app
    command: >
      bash -lc "python scripts/forwarders/high_interaction_logs.py
      --log-file data/runtime/high_interaction_events.jsonl
      --adapter-url http://high-interaction-adapter:8014/v1/high-interaction/events
      --source honeytrap
      --asset-id high-interaction-gateway
      --service tcp
      --event-type tcp.probe
      --asset-routes-file data/runtime/asset_gateway_routes.json
      --poll-seconds 0.5"
    environment:
      PYTHONPATH: /app
    volumes:
      - .:/app
    networks:
      - net_control
    depends_on:
      - high-interaction-adapter
    restart: unless-stopped

  cowrie:
    image: cowrie/cowrie:latest
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${COWRIE_SSH_PORT:-2222}:2222"
    volumes:
      - ./deploy/cowrie/cowrie.cfg:/cowrie/cowrie-git/etc/cowrie.cfg:ro
      - ./deploy/cowrie/var:/cowrie/cowrie-git/var
    networks:
      - net_public
      - net_dmz
    restart: unless-stopped

  snare:
    image: "${SNARE_IMAGE:-dtagdevsec/snare:24.04.1}"
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${SNARE_HTTP_PORT:-8081}:80"
    networks:
      - net_public
      - net_dmz
    depends_on:
      - tanner
    labels:
      honeynet.layer: attacker-entrypoint
      honeynet.integration: snare
    restart: unless-stopped

  tanner:
    image: "${TANNER_IMAGE:-dtagdevsec/tanner:24.04.1}"
    networks:
      - net_dmz
    labels:
      honeynet.layer: attacker-entrypoint
      honeynet.integration: tanner
    restart: unless-stopped

  opencanary-adapter:
    image: python:3.10-slim
    working_dir: /app
    command: >
      bash -lc "pip install -q fastapi uvicorn pydantic &&
      python -m uvicorn services.opencanary.app:app --host 0.0.0.0 --port 8012"
    environment:
      PYTHONPATH: /app
    volumes:
      - .:/app
    expose:
      - "8012"
    networks:
      - net_control
    restart: unless-stopped

  opencanary-forwarder:
    image: python:3.10-slim
    working_dir: /app
    command: >
      bash -lc "python scripts/forwarders/opencanary_json.py
      --log-file /opencanary-var/opencanary.log
      --adapter-url http://opencanary-adapter:8012/v1/opencanary/events
      --asset-routes-file data/runtime/asset_gateway_routes.json
      --poll-seconds 0.5"
    environment:
      PYTHONPATH: /app
    volumes:
      - .:/app
      - ./deploy/opencanary/var:/opencanary-var
    networks:
      - net_control
    depends_on:
      - opencanary-adapter
    restart: unless-stopped

  entrypoint-observer:
    image: python:3.10-slim
    working_dir: /app
    command: >
      bash -lc "pip install -q fastapi uvicorn pydantic PyYAML &&
      python -m uvicorn services.entrypoint.app:app --host 0.0.0.0 --port 8010"
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${ENTRYPOINT_OBSERVER_PORT:-8083}:8010"
    environment:
      PYTHONPATH: /app
      HONEYPOT_ENTRYPOINT_HTTP_SIGMA_RULES_PATH: "${HONEYPOT_ENTRYPOINT_HTTP_SIGMA_RULES_PATH:-data/detections/http_sigma}"
    volumes:
      - .:/app
    expose:
      - "8010"
    networks:
      - net_dmz
      - net_control
    labels:
      honeynet.layer: public-website-backend
      honeynet.integration: entrypoint-observer
    restart: unless-stopped

  cowrie-adapter:
    image: python:3.10-slim
    working_dir: /app
    command: >
      bash -lc "pip install -q fastapi uvicorn pydantic PyYAML &&
      python -m uvicorn services.cowrie.app:app --host 0.0.0.0 --port 8011"
    environment:
      PYTHONPATH: /app
    volumes:
      - .:/app
    expose:
      - "8011"
    networks:
      - net_dmz
      - net_control
    restart: unless-stopped

  cowrie-forwarder:
    image: python:3.10-slim
    working_dir: /app
    command: >
      bash -lc "python scripts/forwarders/cowrie_json.py
      --log-file /cowrie-var/log/cowrie/cowrie.json
      --adapter-url http://cowrie-adapter:8011/v1/cowrie/events
      --poll-seconds 0.5"
    environment:
      PYTHONPATH: /app
    volumes:
      - .:/app
      - ./deploy/cowrie/var:/cowrie-var
    networks:
      - net_control
    depends_on:
      - cowrie
      - cowrie-adapter
    restart: unless-stopped

  internal-portal:
    image: nginx:alpine
    expose:
      - "80"
    volumes:
      - ./deploy/internal-assets/internal-portal/html:/usr/share/nginx/html:ro
    networks:
      - net_internal
    restart: unless-stopped

networks:
  net_public: {}
  net_dmz: {}
  net_internal: {}
  net_control:
    external:
      name: honeynet_net_control
