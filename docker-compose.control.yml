version: "3.3"

services:
  binding-service:
    image: python:3.10-slim
    working_dir: /app
    command: >
      bash -lc "pip install -q fastapi uvicorn pydantic &&
      python -m uvicorn services.binding_service.app:app --host 0.0.0.0 --port 8001"
    environment:
      PYTHONPATH: /app
    volumes:
      - .:/app
    expose:
      - "8001"
    networks:
      - net_control
    restart: unless-stopped

  profiler:
    image: python:3.10-slim
    working_dir: /app
    command: >
      bash -lc "pip install -q fastapi uvicorn pydantic &&
      python -m uvicorn services.profiler.app:app --host 0.0.0.0 --port 8002"
    environment:
      PYTHONPATH: /app
    volumes:
      - .:/app
    expose:
      - "8002"
    networks:
      - net_control
    restart: unless-stopped

  controller:
    image: python:3.10-slim
    working_dir: /app
    command: >
      bash -lc "pip install -q fastapi uvicorn pydantic &&
      python -m uvicorn services.controller.app:app --host 0.0.0.0 --port 8003"
    environment:
      PYTHONPATH: /app
    volumes:
      - .:/app
    expose:
      - "8003"
    networks:
      - net_control
    restart: unless-stopped

  gateway:
    image: python:3.10-slim
    working_dir: /app
    command: >
      bash -lc "pip install -q fastapi uvicorn pydantic &&
      python -m uvicorn services.gateway.app:app --host 0.0.0.0 --port 8004"
    environment:
      PYTHONPATH: /app
    volumes:
      - .:/app
    expose:
      - "8004"
    networks:
      - net_control
    restart: unless-stopped

  dashboard:
    image: python:3.10-slim
    working_dir: /app
    command: >
      bash -lc "pip install -q fastapi uvicorn pydantic &&
      python -m uvicorn services.dashboard.app:app --host 0.0.0.0 --port 8090"
    environment:
      PYTHONPATH: /app
      HONEYPOT_PROJECT_NAME: "${PROJECT_NAME:-honeynet}"
    volumes:
      - .:/app
      - ${DOCKER_CLI_PATH:-/usr/bin/docker}:/usr/bin/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock
    ports:
      - "${HOST_BIND_ADDRESS:-127.0.0.1}:${DASHBOARD_PORT:-8090}:8090"
    expose:
      - "8090"
    networks:
      - net_control
    depends_on:
      - binding-service
      - profiler
      - controller
      - gateway
      - orchestrator
    restart: unless-stopped

  orchestrator:
    image: python:3.10-slim
    working_dir: /app
    command: >
      bash -lc "pip install -q fastapi uvicorn pydantic &&
      python -m uvicorn services.orchestrator.app:app --host 0.0.0.0 --port 8005"
    environment:
      PYTHONPATH: /app
      HONEYPOT_SKIP_RUNTIME_TCP_HEALTHCHECK: "1"
      HONEYPOT_ASSET_GATEWAY_ENABLED: "${HONEYPOT_ASSET_GATEWAY_ENABLED:-1}"
      HONEYPOT_ASSET_GATEWAY_ROUTES_PATH: data/runtime/asset_gateway_routes.json
      HONEYPOT_RUNTIME_HOST_BIND: "${HOST_BIND_ADDRESS:-127.0.0.1}"
      HONEYPOT_ASSET_INTERNAL_PORTAL_PORT: "${INTERNAL_PORTAL_PORT:-18080}"
      HONEYPOT_ASSET_GIT_INTERNAL_PORT: "${GIT_INTERNAL_PORT:-19418}"
      HONEYPOT_ASSET_OPS_DB_PORT: "${OPS_DB_PORT:-13306}"
      HONEYPOT_ASSET_REDIS_CACHE_PORT: "${REDIS_CACHE_PORT:-16379}"
      HONEYPOT_ASSET_WEB_ADMIN_CONSOLE_PORT: "${WEB_ADMIN_CONSOLE_PORT:-18081}"
      HONEYPOT_ASSET_FTP_ARCHIVE_PORT: "${FTP_ARCHIVE_PORT:-12121}"
      HONEYPOT_ASSET_SSH_CANARY_PORT: "${SSH_CANARY_PORT:-12222}"
      HONEYPOT_ASSET_LEGACY_TELNET_PORT: "${LEGACY_TELNET_PORT:-12323}"
      HONEYPOT_ASSET_MAIL_RELAY_PORT: "${MAIL_RELAY_PORT:-2525}"
      HONEYPOT_ASSET_FINANCE_SHARE_PORT: "${FINANCE_SHARE_PORT:-18082}"
      HONEYPOT_ASSET_ICS_PLC_PORT: "${ICS_PLC_PORT:-18084}"
      HONEYPOT_ASSET_CONPOT_MODBUS_PORT: "${CONPOT_MODBUS_PORT:-1502}"
      HONEYPOT_ASSET_CONPOT_S7_PORT: "${CONPOT_S7_PORT:-1102}"
      HONEYPOT_ASSET_DIONAEA_SMB_PORT: "${DIONAEA_SMB_PORT:-1445}"
      HONEYPOT_ASSET_DIONAEA_MSSQL_PORT: "${DIONAEA_MSSQL_PORT:-11433}"
      HONEYPOT_ASSET_DIONAEA_FTP_PORT: "${DIONAEA_FTP_PORT:-12122}"
      HONEYPOT_ASSET_HONEYTRAP_GENERIC_PORT: "${HONEYTRAP_GENERIC_PORT:-19999}"
      HONEYPOT_ASSET_VPN_APPLIANCE_PORT: "${VPN_APPLIANCE_PORT:-18443}"
      HONEYPOT_ASSET_MALWARE_SINK_PORT: "${MALWARE_SINK_PORT:-18085}"
      HONEYPOT_PROJECT_NAME: "${PROJECT_NAME:-honeynet}"
      HONEYPOT_PROJECT_ROOT_IN_CONTAINER: /app
      HONEYPOT_HOST_PROJECT_ROOT: "${HOST_PROJECT_ROOT:-.}"
    volumes:
      - .:/app
      - ${DOCKER_CLI_PATH:-/usr/bin/docker}:/usr/bin/docker:ro
      - /var/run/docker.sock:/var/run/docker.sock
    expose:
      - "8005"
    networks:
      - net_control
    restart: unless-stopped

  adaptive-loop:
    image: python:3.10-slim
    working_dir: /app
    command: >
      bash -lc "python scripts/runtime/adaptive_controller_loop.py
      --state-dir data/runtime
      --controller-url http://controller:8003
      --orchestrator-url http://orchestrator:8005
      --trace-file data/runtime/decision_trace.json
      --loop-state-file data/runtime/adaptive_loop_state.json
      --feedback-file data/runtime/reveal_feedback.json
      --max-actions-per-trigger 2
      --poll-seconds 2"
    environment:
      PYTHONPATH: /app
    volumes:
      - .:/app
    networks:
      - net_control
    depends_on:
      - controller
      - orchestrator
    restart: unless-stopped

networks:
  net_control: {}
