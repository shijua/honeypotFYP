[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dynamic-honeynet"
version = "0.1.0"
description = "Profiling-driven dynamic honeynet with independently testable Python services."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.103.0,<0.111",
  "uvicorn[standard]>=0.30.0,<1.0.0",
  "pydantic>=2.8.0,<2.11",
  "sqlalchemy>=2.0.30,<3.0.0",
  "alembic>=1.13.0,<2.0.0",
  "celery>=5.4.0,<6.0.0",
  "redis>=5.0.0,<6.0.0",
  "elasticsearch>=8.14.0,<9.0.0",
  "kubernetes>=30.1.0,<31.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0,<9.0.0",
  "pytest-asyncio>=0.24.0,<1.0.0",
  "httpx>=0.27.0,<0.28",
  "testcontainers[postgres,redis]>=4.8.0,<5.0.0",
  "ruff>=0.7.0,<1.0.0",
  "mypy>=1.11.0,<2.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["libs*", "services*"]
