title: Conpot ICS Protocol Collection
id: honeynet-conpot-ics-protocol-collection
status: experimental
logsource:
  product: honeynet
  category: high_interaction
honeynet.rule_name: conpot_ics_protocol_collection
detection:
  source:
    honeynet.source: conpot
  selection_protocol:
    honeynet.service:
      - hmi
      - modbus
      - s7
      - snmp
  selection_collection_words:
    logdata|contains:
      - coil
      - plc
      - read
      - register
  condition: source and 1 of selection_*
tags:
  - attack.collection
  - attack.t1005
  - attack.lateral-movement
  - attack.t1021
