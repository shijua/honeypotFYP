title: Public HTTP Credential Discovery
id: honeynet-public-http-credential-discovery
status: experimental
logsource:
  product: honeynet
  category: web
honeynet.rule_name: public_http_credential_discovery
honeynet.evidence_label: public-http credential or backup discovery
detection:
  surface:
    honeynet.surface: public
  selection_combined:
    url.original|contains:
      - .env
      - .aws/credentials
      - .dockercfg
      - .npmrc
      - backup
      - connectionstrings
      - credentials
      - database.yml
      - id_rsa
      - passwd
      - password
      - secret
      - settings.py
      - token
      - wp-config.php
  selection_suffix:
    url.path|endswith:
      - .bak
      - .old
      - .sql
      - .zip
      - .tar
      - .tgz
      - .gz
      - .7z
      - .rar
      - "~"
  condition: surface and 1 of selection_*
tags:
  - attack.credential_access
  - attack.t1552.001
