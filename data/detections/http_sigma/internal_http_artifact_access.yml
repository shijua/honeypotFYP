title: Internal HTTP Finance Data Artifact Access
id: honeynet-internal-http-artifact-access
status: experimental
logsource:
  product: honeynet
  category: web
honeynet.rule_name: internal_http_artifact_access
honeynet.evidence_label: internal-http finance data artifact access
detection:
  surface:
    honeynet.surface: internal
  asset:
    honeynet.asset_id: finance-share
  selection_path:
    url.path|contains:
      - /finance/archive/2024/customer-export-index.csv
      - /finance/archive/2024/archive-manifest.txt
      - /finance/archive/2024/payroll-archive.zip
      - /finance/archive/2024/budget-q4-review.xlsx
      - /exports/
  condition: surface and asset and selection_path
tags:
  - attack.collection
  - attack.t1005
